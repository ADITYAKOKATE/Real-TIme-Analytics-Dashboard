services:
  - type: web
    name: analytics-server
    env: node
    buildCommand: npm install && npm run build:server
    startCommand: npm run start --workspace=apps/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BROKERS
        sync: false
      - key: KAFKA_CLIENT_ID
        value: analytics-server
      - key: KAFKA_GROUP_ID
        value: analytics-consumer-group
      - key: CLIENT_URL
        sync: false
