services:
  - type: web
    name: analytics-server
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:server
    startCommand: npm run start --workspace=apps/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
